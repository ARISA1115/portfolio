name: Fetch Articles

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 JST 10:00 (UTC 01:00) に実行
  workflow_dispatch:  # 手動実行にも対応

permissions:
  contents: write

jobs:
  fetch-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Fetch articles from Qiita and Zenn
        run: go run .
        working-directory: scripts/fetch-articles
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}

      - name: Commit and push if articles.json changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/articles.json
          git diff --staged --quiet || git commit -m "chore: update articles data [skip ci]"
          git push
